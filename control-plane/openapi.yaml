openapi: 3.1.0
info:
  title: Independent Connectivity Platform Control Plane
  version: 0.2.0
  description: >
    Local-first API contract for the authorized connectivity prototype.
    This specification does not imply a deployed API or operational gateway.

servers:
  - url: http://127.0.0.1:8765
    description: Local development only.

paths:
  /v1/health:
    get:
      summary: Public service health check
      security: []
      responses:
        "200":
          description: Service is alive
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    enum: [ok]

  /v1/devices/enroll:
    post:
      summary: Enroll an Android device
      description: >
        The device generates its own WireGuard key pair.
        Only its public key is submitted. The returned device token
        is shown once and must be stored securely by the client.
      security:
        - enrollmentToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [device_public_key, platform]
              properties:
                device_public_key:
                  type: string
                  description: Base64-encoded WireGuard public key only.
                platform:
                  type: string
                  enum: [android]
                app_version:
                  type: string
      responses:
        "201":
          description: Device enrolled; token returned once.
          content:
            application/json:
              schema:
                type: object
                required: [device_id, device_token, status]
                properties:
                  device_id:
                    type: string
                  device_token:
                    type: string
                    description: Secret bearer token; store securely.
                  status:
                    type: string
                    enum: [enrolled]
        "400":
          description: Invalid request or public key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "401":
          description: Invalid enrollment token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1/gateways:
    get:
      summary: List eligible registered gateways
      security:
        - deviceAuth: []
      responses:
        "200":
          description: Eligible gateways
          content:
            application/json:
              schema:
                type: object
                required: [gateways]
                properties:
                  gateways:
                    type: array
                    items:
                      $ref: '#/components/schemas/Gateway'
        "401":
          description: Device authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1/entitlements:
    get:
      summary: List the authenticated device's entitlements
      security:
        - deviceAuth: []
      responses:
        "200":
          description: Device entitlements
          content:
            application/json:
              schema:
                type: object
                required: [entitlements]
                properties:
                  entitlements:
                    type: array
                    items:
                      $ref: '#/components/schemas/Entitlement'
        "401":
          description: Device authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1/entitlements/activate:
    post:
      summary: Activate a time-based pass
      description: >
        Device identity is derived from the bearer token.
        The request must not contain a device_id.
      security:
        - deviceAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [activation_code]
              properties:
                activation_code:
                  type: string
      responses:
        "200":
          description: Entitlement activated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Entitlement'
        "400":
          description: Invalid, redeemed, or ineligible activation code
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "401":
          description: Device authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1/admin/activation-codes:
    post:
      summary: Issue a development activation code
      security:
        - adminAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [duration_hours]
              properties:
                duration_hours:
                  type: integer
                  enum: [24, 72, 168]
      responses:
        "201":
          description: Code issued; shown once
        "400":
          description: Unsupported duration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "403":
          description: Admin permission required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1/admin/gateways:
    post:
      summary: Register or update a gateway
      security:
        - adminAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GatewayRegistration'
      responses:
        "201":
          description: Gateway registered
        "400":
          description: Invalid gateway details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "403":
          description: Admin permission required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1/admin/devices/{device_id}/revoke:
    post:
      summary: Revoke a device and its credentials
      security:
        - adminAuth: []
      parameters:
        - name: device_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "202":
          description: Device revoked
        "400":
          description: Unknown device
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "403":
          description: Admin permission required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  securitySchemes:
    deviceAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
    adminAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
    enrollmentToken:
      type: http
      scheme: bearer
      bearerFormat: opaque

  schemas:
    Error:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: string

    Gateway:
      type: object
      required:
        - gateway_id
        - display_name
        - region
        - status
        - endpoint
        - capacity_state
      properties:
        gateway_id:
          type: string
          minLength: 1
          maxLength: 64
          pattern: '^[A-Za-z0-9][A-Za-z0-9_-]{0,63}$'
        display_name:
          type: string
          minLength: 1
          maxLength: 100
        region:
          type: string
          minLength: 1
          maxLength: 80
          description: Coarse service region, not private host location.
        status:
          type: string
          enum: [healthy, degraded, unavailable]
        endpoint:
          type: string
          maxLength: 300
          pattern: '^(?:[A-Za-z0-9.-]+:[0-9]{1,5}|\[[0-9A-Fa-f:.]+\]:[0-9]{1,5})$'
          description: Host and UDP port; IPv6 addresses must be bracketed. Runtime validation checks host and port validity.
        capacity_state:
          type: string
          enum: [available, limited, full]

    GatewayRegistration:
      type: object
      additionalProperties: false
      required:
        - gateway_id
        - display_name
        - region
        - endpoint
        - server_public_key
        - status
        - capacity_state
      properties:
        gateway_id:
          type: string
          minLength: 1
          maxLength: 64
          pattern: '^[A-Za-z0-9][A-Za-z0-9_-]{0,63}$'
        display_name:
          type: string
          minLength: 1
          maxLength: 100
        region:
          type: string
          minLength: 1
          maxLength: 80
        endpoint:
          type: string
          maxLength: 300
          pattern: '^(?:[A-Za-z0-9.-]+:[0-9]{1,5}|\[[0-9A-Fa-f:.]+\]:[0-9]{1,5})$'
          description: Host and UDP port; IPv6 addresses must be bracketed. Runtime validation checks host and port validity.
        server_public_key:
          type: string
          minLength: 44
          maxLength: 44
          pattern: '^[A-Za-z0-9+/]{42}[AEIMQUYcgkosw048]=$'
          description: Canonical Base64-encoded 32-byte WireGuard server public key.
        status:
          type: string
          enum: [healthy, degraded, unavailable]
        capacity_state:
          type: string
          enum: [available, limited, full]

    Entitlement:
      type: object
      required:
        - entitlement_id
        - status
        - starts_at
        - expires_at
      properties:
        entitlement_id:
          type: string
        status:
          type: string
          enum: [active, pending, expired, revoked]
        starts_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
