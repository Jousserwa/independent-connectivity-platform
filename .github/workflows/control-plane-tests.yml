name: Control-plane unit tests

on:
  push:
    paths:
      - "control-plane/**"
      - ".github/workflows/control-plane-tests.yml"
  pull_request:
    paths:
      - "control-plane/**"
      - ".github/workflows/control-plane-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run dependency-free unit tests
        working-directory: control-plane
        run: python -m unittest -v
